name: Validate contribution

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Validate data.json (structure + referenced files exist)
        run: npm run validate-data

      - name: Type-check and build the site
        run: npm run build
